<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1024" height="600" fill="#C0E3F5"/>

  <!-- Sun -->
  <g transform="translate(880, 80)">
    <circle cx="0" cy="0" r="38" fill="#FFEC8E" stroke="#2D2D2D" stroke-width="2.5" opacity="0.7"/>
    <!-- Sun rays -->
    <g stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.4">
      <line x1="0" y1="-50" x2="0" y2="-58"/>
      <line x1="0" y1="50" x2="0" y2="58"/>
      <line x1="-50" y1="0" x2="-58" y2="0"/>
      <line x1="50" y1="0" x2="58" y2="0"/>
      <line x1="-35" y1="-35" x2="-42" y2="-42"/>
      <line x1="35" y1="35" x2="42" y2="42"/>
      <line x1="-35" y1="35" x2="-42" y2="42"/>
      <line x1="35" y1="-35" x2="42" y2="-42"/>
    </g>
  </g>

  <!-- Stars -->
  <g stroke="#2D2D2D" stroke-width="2" stroke-linejoin="round">
    <path d="M15 3 L18 11 L26 13 L19 19 L21 27 L15 23 L9 27 L11 19 L4 13 L12 11Z" fill="#FFEC8E" transform="translate(130, 70) rotate(10) scale(0.67)"/>
    <path d="M15 3 L18 11 L26 13 L19 19 L21 27 L15 23 L9 27 L11 19 L4 13 L12 11Z" fill="#FCF3B9" transform="translate(680, 100) rotate(-8) scale(0.53)"/>
    <path d="M15 3 L18 11 L26 13 L19 19 L21 27 L15 23 L9 27 L11 19 L4 13 L12 11Z" fill="#FFEC8E" transform="translate(780, 22) rotate(15) scale(0.6)"/>
    <path d="M15 3 L18 11 L26 13 L19 19 L21 27 L15 23 L9 27 L11 19 L4 13 L12 11Z" fill="#FCF3B9" transform="translate(420, 80) rotate(22) scale(0.47)"/>
    <path d="M15 3 L18 11 L26 13 L19 19 L21 27 L15 23 L9 27 L11 19 L4 13 L12 11Z" fill="#CCE7E3" transform="translate(60, 50) rotate(-14) scale(0.57)"/>
    <path d="M15 3 L18 11 L26 13 L19 19 L21 27 L15 23 L9 27 L11 19 L4 13 L12 11Z" fill="#FFEC8E" transform="translate(560, 36) rotate(18) scale(0.43)"/>
  </g>

  <!-- Clouds -->
  <g fill="#CCE7E3" stroke="#2D2D2D" stroke-width="2" opacity="0.45">
    <path d="M18 40 Q12 28 20 22 Q16 8 32 12 Q38 -2 52 10 Q62 -2 72 14 Q88 8 86 24 Q96 28 86 40 Q76 44 58 42Z" transform="translate(150, 120) scale(0.65)"/>
    <path d="M15 35 Q10 22 18 16 Q14 4 30 10 Q36 0 48 8 Q58 -2 68 12 Q82 6 78 22 Q88 26 80 36 Q70 40 54 38Z" transform="translate(500, 160) scale(0.55)"/>
    <path d="M16 38 Q10 24 18 18 Q14 6 30 10 Q36 0 48 8 Q58 -2 68 10 Q82 6 78 22 Q88 26 80 36 Z" transform="translate(280, 240) scale(0.48)"/>
    <path d="M18 40 Q12 28 20 22 Q16 8 32 12 Q38 -2 52 10 Q62 -2 72 14 Q88 8 86 24 Q96 28 86 40 Q76 44 58 42Z" transform="translate(680, 260) scale(0.5)"/>
    <path d="M15 35 Q10 22 18 16 Q14 4 30 10 Q36 0 48 8 Q58 -2 68 12 Q82 6 78 22 Q88 26 80 36 Q70 40 54 38Z" transform="translate(60, 310) scale(0.42)"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M2 12 Q8 2 15 6 Q22 2 28 12" transform="translate(380, 100) scale(0.9)"/>
    <path d="M2 10 Q7 2 12 5 Q17 2 22 10" transform="translate(440, 114) scale(0.85)"/>
    <path d="M2 12 Q8 2 15 6 Q22 2 28 12" transform="translate(410, 125) scale(0.7)"/>
    <path d="M2 10 Q7 2 12 5 Q17 2 22 10" transform="translate(320, 60) scale(0.6)"/>
    <path d="M2 12 Q8 2 15 6 Q22 2 28 12" transform="translate(750, 180) scale(0.75)"/>
    <path d="M2 10 Q7 2 12 5 Q17 2 22 10" transform="translate(790, 195) scale(0.65)"/>
  </g>

  <!-- Ground: green rolling hills -->
  <path d="M0 440 Q80 400 180 425 Q280 450 380 415 Q480 390 560 430 Q640 460 740 420 Q820 395 920 425 Q980 440 1024 415 L1024 600 L0 600Z"
        fill="#AACE7B" stroke="#2D2D2D" stroke-width="2.5" opacity="0.55"/>

  <!-- Ground: deeper green mid-layer -->
  <path d="M0 470 Q120 445 240 460 Q360 475 480 450 Q600 435 720 455 Q840 470 960 448 Q1000 442 1024 448 L1024 600 L0 600Z"
        fill="#8BC34A" stroke="none" opacity="0.5"/>

  <!-- Ground: brown dirt path at bottom -->
  <rect x="0" y="500" width="1024" height="100" fill="#D4A76A" stroke="#2D2D2D" stroke-width="1.5" opacity="0.35"/>

  <!-- Grass tufts along hilltop -->
  <g stroke="#6B9B37" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M80 423 Q86 412 83 405"/><path d="M110 425 Q114 414 112 406"/>
    <path d="M230 429 Q236 418 233 411"/><path d="M270 423 Q275 412 272 404"/>
    <path d="M340 422 Q346 411 342 403"/><path d="M380 415 Q385 405 381 398"/>
    <path d="M440 418 Q447 407 443 399"/><path d="M480 420 Q487 410 484 402"/>
    <path d="M530 428 Q536 417 533 410"/><path d="M580 432 Q586 422 583 414"/>
    <path d="M680 425 Q685 414 682 406"/><path d="M720 421 Q726 410 722 403"/>
    <path d="M810 425 Q815 414 812 406"/><path d="M860 428 Q866 418 862 411"/>
    <path d="M920 430 Q927 419 924 412"/><path d="M960 432 Q966 422 963 414"/>
  </g>

  <!-- Bush -->
  <g stroke="#2D2D2D" stroke-width="2.5" opacity="0.55">
    <ellipse cx="800" cy="418" rx="30" ry="22" fill="#8BC34A"/>
    <ellipse cx="835" cy="412" rx="34" ry="26" fill="#AACE7B"/>
    <ellipse cx="868" cy="418" rx="28" ry="20" fill="#8BC34A"/>
  </g>

  <!-- Small bush left -->
  <g stroke="#2D2D2D" stroke-width="2" opacity="0.45">
    <ellipse cx="100" cy="422" rx="22" ry="16" fill="#8BC34A"/>
    <ellipse cx="126" cy="419" rx="24" ry="18" fill="#AACE7B"/>
  </g>

  <!-- Flowers -->
  <g stroke="#2D2D2D" stroke-width="2">
    <circle cx="60" cy="440" r="5" fill="#FFEC8E"/><circle cx="60" cy="449" r="2.8" fill="#AACE7B" stroke-width="1.5"/>
    <circle cx="260" cy="445" r="4.5" fill="#FCF3B9"/><circle cx="260" cy="454" r="2.5" fill="#AACE7B" stroke-width="1.5"/>
    <circle cx="500" cy="438" r="4.8" fill="#FFEC8E"/><circle cx="500" cy="447" r="2.6" fill="#AACE7B" stroke-width="1.5"/>
    <circle cx="900" cy="435" r="5.5" fill="#FCF3B9"/><circle cx="900" cy="445" r="3" fill="#AACE7B" stroke-width="1.5"/>
  </g>

  <!-- Noise texture overlay -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.04" style="mix-blend-mode: multiply"/>
</svg>
