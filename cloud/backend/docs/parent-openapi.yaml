openapi: 3.0.3
info:
  title: 家长端微信小程序 API
  version: 0.2.0-draft
  description: 家长端 API，统一前缀 /v1/api/parent。普通 JSON 响应使用 {code,msg,data}，与车机端 /v1/api/car 保持一致。
servers:
- url: https://api.example.com
  description: 示例域名，路径已包含 /v1/api/parent 前缀
tags:
- name: Auth
  description: 微信登录、手机号绑定与 JWT
- name: Children
  description: 孩子资料与家庭关系
- name: Device
  description: 车机/机器人设备绑定与管理
- name: Learning Config
  description: 六个学习模块配置
- name: Learning Goal
  description: 每日学习目标
- name: Dashboard
  description: 今日任务与学习大盘
- name: Dispatched Tasks
  description: 家长主动派发任务
- name: Behavior
  description: 专注度、坐姿、位置等行为数据
- name: Usage
  description: 设备使用时长统计
- name: Reports
  description: 学习进度、周报、错题
- name: Parent Messages
  description: 家长消息下发与历史
- name: Remote Control
  description: 远程跳转与在线状态
- name: Notification Settings
  description: 通知设置
- name: Notifications
  description: 通知中心
- name: Files
  description: 文件上传和私有访问
paths:
  /v1/api/parent/auth/wechat/login:
    post:
      tags:
      - Auth
      summary: 微信小程序登录
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/auth/phone/bind:
    post:
      tags:
      - Auth
      summary: 绑定手机号
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneBindRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/auth/token/refresh:
    post:
      tags:
      - Auth
      summary: 刷新 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/auth/logout:
    post:
      tags:
      - Auth
      summary: 退出登录
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children:
    get:
      tags:
      - Children
      summary: 获取孩子列表
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    post:
      tags:
      - Children
      summary: 新增孩子
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}:
    get:
      tags:
      - Children
      summary: 获取孩子详情
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    put:
      tags:
      - Children
      summary: 更新孩子资料
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    delete:
      tags:
      - Children
      summary: 解绑孩子
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/device:
    get:
      tags:
      - Device
      summary: 获取已绑定设备
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    put:
      tags:
      - Device
      summary: 修改设备名称
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    delete:
      tags:
      - Device
      summary: 解绑设备
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/device/bind:
    post:
      tags:
      - Device
      summary: 绑定新设备
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindDeviceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '409':
          description: Device already bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/api/parent/children/{child_id}/learning/config:
    get:
      tags:
      - Learning Config
      summary: 获取当前学习配置
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    put:
      tags:
      - Learning Config
      summary: 更新学习配置
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearningConfigRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/learning/config/audit:
    get:
      tags:
      - Learning Config
      summary: 获取配置变更历史
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: module
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Module'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/learning/goal:
    get:
      tags:
      - Learning Goal
      summary: 获取每日学习目标
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    put:
      tags:
      - Learning Goal
      summary: 更新每日学习目标
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearningGoalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/dashboard/today:
    get:
      tags:
      - Dashboard
      summary: 今日学习大盘
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/today-tasks:
    get:
      tags:
      - Dashboard
      summary: 获取今日任务列表
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/today-tasks/{task_id}:
    get:
      tags:
      - Dashboard
      summary: 获取任务详情
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/dispatched-tasks:
    get:
      tags:
      - Dispatched Tasks
      summary: 获取今日已派发任务
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
    post:
      tags:
      - Dispatched Tasks
      summary: 家长派发任务
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchTasksRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/behavior/focus:
    get:
      tags:
      - Behavior
      summary: 专注度数据
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/behavior/posture:
