components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          example: 0
        msg:
          type: string
          example: ok
        data:
          nullable: true
          description: 具体接口正文
    ErrorEnvelope:
      type: object
      required:
      - code
      - msg
      - data
      properties:
        code:
          type: integer
          example: 42004
        msg:
          type: string
          example: device_already_bound
        data:
          nullable: true
          type: object
    WechatLoginRequest:
      type: object
      required:
      - wx_code
      - app_id
      properties:
        wx_code:
          type: string
        app_id:
          type: string
        invite_code:
          type: string
          nullable: true
    PhoneBindRequest:
      type: object
      required:
      - wx_bind_token
      properties:
        wx_bind_token:
          type: string
        encrypted_data:
          type: string
          nullable: true
        iv:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        verify_code:
          type: string
          nullable: true
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    ParentInfo:
      type: object
      properties:
        parent_id:
          type: string
        phone_masked:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
    FamilyInfo:
      type: object
      properties:
        family_id:
          type: string
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildSummary'
    ChildSummary:
      type: object
      properties:
        child_id:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - boy
          - girl
          - unknown
          nullable: true
        family_id:
          type: string
        family_name:
          type: string
        is_default:
          type: boolean
    CreateChildRequest:
      type: object
      required:
      - nickname
      - family_id
      properties:
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - boy
          - girl
          - unknown
          nullable: true
        family_id:
          type: string
    UpdateChildRequest:
      type: object
      required:
      - nickname
      properties:
        nickname:
          type: string
        avatar_url:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - boy
          - girl
          - unknown
          nullable: true
    DeviceType:
      type: string
      enum:
