        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/behavior/location:
    get:
      tags:
      - Behavior
      summary: 位置区域数据
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/behavior/insights:
    get:
      tags:
      - Behavior
      summary: 行为洞察
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: period
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
      - name: type
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/usage:
    get:
      tags:
      - Usage
      summary: 使用时长序列
      security:
      - bearerAuth: []
      parameters:
      - name: child_id
        in: path
        required: true
        schema:
          type: string
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: day
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
  /v1/api/parent/children/{child_id}/usage/modules:
    get:
      tags:
      - Usage
